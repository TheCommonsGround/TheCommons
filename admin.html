<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Commons — Event Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #123028;
    --ink: #14140F;
    --ink-soft: #6B6B63;
    --line: #E2E2DC;
    --paper: #FFFFFF;
    --paper-deep: #F4F4F1;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--paper-deep);
    color: var(--ink);
  }
  header{
    background: var(--forest);
    color: #FFFFFF;
    padding: 20px 28px;
  }
  header h1{
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 0 0 4px;
  }
  header p{
    margin: 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.7);
  }
  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 28px;
  }
  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 24px;
  }
  .card h2{ font-size: 16px; margin: 0 0 16px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="time"],
  .field input[type="number"]{
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .field-row{ display: flex; gap: 12px; }
  .field-row .field{ flex: 1; }
  .tag-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
    margin-top: 6px;
  }
  .tag-grid label{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary{
    background: var(--forest);
    color: #FFFFFF;
    border: none;
    padding: 12px 22px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button.primary:hover{ opacity: 0.9; }
  .status-line{
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 18px;
  }
  .event-row{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .event-row:last-child{ border-bottom: none; }
  .event-row .info strong{ display: block; font-size: 14px; margin-bottom: 2px; }
  .event-row .info span{ font-size: 12.5px; color: var(--ink-soft); }
  .event-row button.delete{
    background: none;
    border: 1px solid var(--line);
    color: #A33B2B;
    border-radius: 3px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .event-row button.delete:hover{ background: #FBEAE6; }
  .empty{ color: var(--ink-soft); font-size: 13.5px; padding: 10px 0; }
</style>
</head>
<body>

<header>
  <h1>The Commons — Event Admin</h1>
  <p>Add and remove real events. This page has no login — keep this link private for now.</p>
</header>

<main>
  <div class="card">
    <h2>Add an event</h2>
    <form id="eventForm">
      <div class="field">
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" required>
      </div>
      <div class="field">
        <label for="fAddress">Address of event</label>
        <input type="text" id="fAddress" placeholder="e.g. 5192 Herrick Ave, Charlotte, VT 05445" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fOrg">Organization</label>
          <input type="text" id="fOrg" required>
        </div>
        <div class="field">
          <label for="fTown">Town, State</label>
          <input type="text" id="fTown" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fDate">Date</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field">
          <label for="fTime">Time</label>
          <input type="time" id="fTime" required>
        </div>
      </div>
      <div class="field">
        <label for="fHours">Duration (hours)</label>
        <input type="number" id="fHours" min="0" step="0.5" required style="max-width: 160px;">
      </div>
      <div class="field">
        <label for="fLink">Link to the original event listing (or contact info, if no page exists)</label>
        <input type="text" id="fLink" placeholder="https://... or a phone number / email if there's no page">
      </div>
      <div class="field">
        <label>Activity tags</label>
        <div class="tag-grid" id="tagGrid"></div>
      </div>
      <button type="submit" class="primary">Add event</button>
      <div class="status-line" id="formStatus"></div>
    </form>
  </div>

  <div class="card">
    <h2>Current events (<span id="eventCount">0</span>)</h2>
    <div id="eventList"></div>
  </div>
</main>

<script>
  const ACTIVITY_TAGS = [
    "Tree Planting","Trail Work","Beach Cleanup","River Cleanup","Wildlife Surveys",
    "Birding","Citizen Science","Gardening","Habitat Restoration","Climate Activism",
    "Environmental Education","Hiking","Conservation","Photography","Volunteer",
    "Paid Jobs","Internships","Family-friendly","Disabilities Accessible",
    "Beginner Friendly","Community","Youth Programs"
  ];

  function buildTagGrid(){
    const grid = document.getElementById('tagGrid');
    grid.innerHTML = ACTIVITY_TAGS.map(tag => `
      <label><input type="checkbox" value="${tag}"> ${tag}</label>
    `).join('');
  }

  async function loadEvents(){
    const listEl = document.getElementById('eventList');
    const countEl = document.getElementById('eventCount');
    try {
      const res = await fetch('/.netlify/functions/get-events');
      const events = await res.json();
      countEl.textContent = events.length;
      if (!events.length){
        listEl.innerHTML = '<p class="empty">No events yet — add the first one above.</p>';
        return;
      }
      listEl.innerHTML = events.map(ev => `
        <div class="event-row">
          <div class="info">
            <strong>${ev.title}</strong>
            <span>${ev.org} — ${ev.address || ev.town} · ${ev.date} ${ev.time} · ${ev.tags.join(', ')}</span>
            <span>${ev.lat != null ? '&#128205; Geocoded' : '&#9888; Not geocoded — distance will not show until the address is fixed'}</span>
            <span>${ev.link ? `&#128279; <a href="${ev.link}" target="_blank" rel="noopener">${ev.link}</a>` : '&#9888; No link saved — the site can\'t point people anywhere for more info'}</span>
          </div>
          <button class="delete" onclick="deleteEvent('${ev.id}')">Delete</button>
        </div>
      `).join('');
    } catch (err) {
      listEl.innerHTML = '<p class="empty">Could not load events — this only works once deployed live on Netlify with the function set up, not from a local file.</p>';
    }
  }

  async function deleteEvent(id){
    if (!confirm('Delete this event?')) return;
    try {
      await fetch('/.netlify/functions/delete-event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      loadEvents();
    } catch (err) {
      alert('Could not delete — check the console for details.');
    }
  }

  document.getElementById('eventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('formStatus');
    const tags = Array.from(document.querySelectorAll('#tagGrid input:checked')).map(el => el.value);

    if (!tags.length){
      status.textContent = 'Pick at least one activity tag.';
      return;
    }

    const payload = {
      title: document.getElementById('fTitle').value,
      org: document.getElementById('fOrg').value,
      town: document.getElementById('fTown').value,
      address: document.getElementById('fAddress').value,
      date: document.getElementById('fDate').value,
      time: document.getElementById('fTime').value,
      hours: document.getElementById('fHours').value,
      link: document.getElementById('fLink').value,
      tags: tags
    };

    status.textContent = 'Saving…';
    try {
      const res = await fetch('/.netlify/functions/save-event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success){
        status.textContent = data.warning ? `Added — but ${data.warning}` : 'Added, and geocoded successfully.';
        document.getElementById('eventForm').reset();
        loadEvents();
      } else {
        status.textContent = data.error || 'Something went wrong.';
      }
    } catch (err) {
      status.textContent = "Could not save — this only works once deployed live on Netlify, not from a local file.";
    }
  });

  buildTagGrid();
  loadEvents();
</script>
</body>
</html>
